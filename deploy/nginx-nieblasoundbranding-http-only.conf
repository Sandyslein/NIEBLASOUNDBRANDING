# Fase inicial: solo HTTP para validar ACME y servir el sitio antes del certificado SSL.
server {
    listen 80;
    listen [::]:80;
    server_name nieblasoundbranding.com www.nieblasoundbranding.com;

    root /var/www/nieblasoundbranding;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
