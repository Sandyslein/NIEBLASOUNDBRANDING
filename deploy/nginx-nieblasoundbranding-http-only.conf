# Fase inicial: solo HTTP para validar ACME y servir el sitio antes del certificado SSL.
# Misma regla de indexación que la config con TLS: la home se sirve en /
# y una ruta inexistente responde 404, no el HTML de la home.
server {
    listen 80;
    listen [::]:80;
    server_name nieblasoundbranding.com www.nieblasoundbranding.com;

    root /var/www/nieblasoundbranding;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /index.html {
        return 301 /;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
