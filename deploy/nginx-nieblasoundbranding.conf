# NIEBLA Sound Branding — sitio estático en /var/www/nieblasoundbranding
# Certificados: certbot (Let's Encrypt) en /etc/letsencrypt/live/nieblasoundbranding.com/
#
# El sitio es una sola página. Una URL que no existe debe responder 404.
# No reenviar todo a /index.html: eso devolvía HTTP 200 con el HTML de la home
# (soft 404 y duplicados con el mismo canonical) y, si /index.html no se puede
# servir, nginx entra en un ciclo de redirección interna y responde 500.

# ---------- :80 (ACME + sitio sin redirect global: Cloudflare gestiona HTTPS y evita bucles en modo Flexible) ----------
server {
    listen 80;
    listen [::]:80;
    server_name nieblasoundbranding.com www.nieblasoundbranding.com;

    root /var/www/nieblasoundbranding;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /index.html {
        return 301 https://nieblasoundbranding.com/;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
}

# ---------- www:443 → apex (sin if: if + try_files puede responder 500) ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nieblasoundbranding.com;

    ssl_certificate     /etc/letsencrypt/live/nieblasoundbranding.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nieblasoundbranding.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    return 301 https://nieblasoundbranding.com$request_uri;
}

# ---------- apex:443 ----------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name nieblasoundbranding.com;

    ssl_certificate     /etc/letsencrypt/live/nieblasoundbranding.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nieblasoundbranding.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    root /var/www/nieblasoundbranding;

    location = /index.html {
        return 301 https://nieblasoundbranding.com/;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?|xml|txt|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
