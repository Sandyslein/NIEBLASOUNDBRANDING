# NIEBLA Sound Branding — sitio estático en /var/www/nieblasoundbranding
# Certificados: certbot (Let's Encrypt) en /etc/letsencrypt/live/nieblasoundbranding.com/

# ---------- :80 (ACME + sitio sin redirect: Cloudflare gestiona HTTPS y evita bucles en modo Flexible) ----------
server {
    listen 80;
    listen [::]:80;
    server_name nieblasoundbranding.com www.nieblasoundbranding.com;

    root /var/www/nieblasoundbranding;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- :443 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nieblasoundbranding.com www.nieblasoundbranding.com;

    ssl_certificate     /etc/letsencrypt/live/nieblasoundbranding.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nieblasoundbranding.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    if ($host = www.nieblasoundbranding.com) {
        return 301 https://nieblasoundbranding.com$request_uri;
    }

    root /var/www/nieblasoundbranding;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?|xml|txt|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
